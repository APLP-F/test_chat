<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Autenticación Puerto Emplea</title>
  </head>
  <body>
    <script type="module">
      import { PublicClientApplication } from 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/+esm';

      const msalInstance = new PublicClientApplication({
        auth: {
          clientId: '84ef3bdb-a4d5-4094-8e8f-c763b1a3edbb',
          authority: 'https://login.microsoftonline.com/436efeb8-20ec-47a9-9dbb-3deab23539f5',
          redirectUri: 'https://aplp-f.github.io/test_chat/auth.html'
        },
        cache: {
          cacheLocation: 'sessionStorage',
          storeAuthStateInCookie: true
        }
      });

      await msalInstance.initialize();
      await msalInstance.handleRedirectPromise();
    </script>
  </body>
</html>
