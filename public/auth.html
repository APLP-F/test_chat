<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Autenticación Puerto Emplea</title>
  </head>

  <body>
    <p style="font-family: Segoe UI, sans-serif; padding: 24px;">
      Completando autenticación...
    </p>

    <script type="module">
      import { PublicClientApplication } from "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/+esm";

      const clientId = "84ef3bdb-a4d5-4094-8e8f-c763b1a3edbb";
      const tenantId = "436efeb8-20ec-47a9-9dbb-3deab23539f5";

      const redirectUri = "https://aplp-f.github.io/test_chat/auth.html";

      // Mismo scope que usa el chat (authConfig.ts), para que la caché de MSAL
      // sea compartida y el chat pueda renovar el token sin pedir login.
      const loginRequest = {
        scopes: ["https://api.powerplatform.com/CopilotStudio.Copilots.Invoke"],
        redirectUri
      };

      const params = new URLSearchParams(window.location.search);
      const loginHint = params.get("hint") || undefined;

      // localStorage (antes sessionStorage): la cuenta queda guardada en este origen
      // y se comparte con el chat (mismo dominio), de modo que no hay que volver
      // a elegir cuenta ni a iniciar sesión.
      const msalInstance = new PublicClientApplication({
        auth: {
          clientId,
          authority: `https://login.microsoftonline.com/${tenantId}`,
          redirectUri
        },
        cache: {
          cacheLocation: "localStorage",
          storeAuthStateInCookie: true
        }
      });

      function enviarResultado(data) {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(data, window.location.origin);
        }
      }

      async function enviarExito(account, accessToken) {
        enviarResultado({
          type: "PUERTO_EMPLEA_AUTH_SUCCESS",
          username: account.username,
          accessToken
        });

        window.close();
      }

      try {
        await msalInstance.initialize();

        const result = await msalInstance.handleRedirectPromise();

        if (result && result.account) {
          let accessToken = result.accessToken;

          if (!accessToken) {
            const silentResult = await msalInstance.acquireTokenSilent({
              ...loginRequest,
              account: result.account
            });

            accessToken = silentResult.accessToken;
          }

          await enviarExito(result.account, accessToken);
        } else {
          // Si ya hay una cuenta guardada, intenta obtener el token sin mostrar nada.
          const cuentas = msalInstance.getAllAccounts();
          const cuenta =
            cuentas.find(
              (c) => loginHint && c.username.toLowerCase() === loginHint.toLowerCase()
            ) || cuentas[0];

          let resuelto = false;

          if (cuenta) {
            try {
              const silentResult = await msalInstance.acquireTokenSilent({
                ...loginRequest,
                account: cuenta
              });

              await enviarExito(cuenta, silentResult.accessToken);
              resuelto = true;
            } catch (silentError) {
              console.warn("Token silencioso no disponible, se pedirá login:", silentError);
            }
          }

          if (!resuelto) {
            // Sin "prompt: select_account": si hay una sola sesión de Microsoft
            // activa, entra directamente sin pedir elegir cuenta.
            await msalInstance.loginRedirect({
              ...loginRequest,
              ...(loginHint ? { loginHint } : {})
            });
          }
        }
      } catch (error) {
        enviarResultado({
          type: "PUERTO_EMPLEA_AUTH_ERROR",
          error: error instanceof Error ? error.message : String(error)
        });

        document.body.innerHTML =
          "<pre style='font-family: Consolas, monospace; white-space: pre-wrap; padding:24px;'>Error autenticando:\n" +
          (error instanceof Error ? error.message : String(error)) +
          "</pre>";
      }
    </script>
  </body>
</html>
